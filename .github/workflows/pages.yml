# Auto-deploy admin.html + index.html to GitHub Pages on every push to main.
# Pages must be enabled in repo Settings → Pages → Source = GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only run one deploy at a time; cancel in-progress if a newer push arrives.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Only ship the two frontend HTML files — the Node worker files
      # (apply.js, discoverAuto.js, etc.) stay in the repo but aren't
      # served at the site URL.
      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp index.html admin.html _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
