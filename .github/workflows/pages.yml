# Auto-deploy only the public frontend and its required assets on pushes to main.
# Pages must be enabled in repo Settings → Pages → Source = GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deploys. Newer releases must not be overwritten by older runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Explicit public asset allowlist: never upload worker code or credentials.
      - name: Prepare site directory
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html admin.html supportAccess.js _site/
          touch _site/.nojekyll
          node -e 'require("fs").writeFileSync("_site/build.json", JSON.stringify({commit:process.env.GITHUB_SHA,version:"approval-fireworks-v3"})+"\n")'
          node validatePagesBuild.js _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published frontend assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          verify_dir=$(mktemp -d)
          base="${PAGE_URL%/}"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location "$base/build.json?release=$GITHUB_SHA" -o "$verify_dir/build.json" && EXPECTED_PAGES_SHA="$GITHUB_SHA" node -e 'const b=require(process.argv[1]);if(b.commit!==process.env.EXPECTED_PAGES_SHA)process.exit(1)' "$verify_dir/build.json"; then
              break
            fi
            sleep 5
          done
          for file in index.html admin.html supportAccess.js; do
            curl --fail --silent --show-error --location --retry 3 "$base/$file?release=$GITHUB_SHA" -o "$verify_dir/$file"
          done
          touch "$verify_dir/.nojekyll"
          EXPECTED_PAGES_SHA="$GITHUB_SHA" node validatePagesBuild.js "$verify_dir"
